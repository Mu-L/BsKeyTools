name: Sync to Gitee

# 每次 push main 都镜像代码（发版由 release.yml 处理，这里只同步代码）
on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to Gitee
        continue-on-error: true
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/gitee_key
          chmod 600 ~/.ssh/gitee_key
          ssh-keyscan -t ed25519 gitee.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote add gitee git@gitee.com:acebullet/BsKeyTools.git 2>/dev/null || \
            git remote set-url gitee git@gitee.com:acebullet/BsKeyTools.git
          GIT_SSH_COMMAND="ssh -i ~/.ssh/gitee_key -o StrictHostKeyChecking=no" \
            git push gitee main --force --tags
          rm -f ~/.ssh/gitee_key
