name: Build and Release

# 触发条件：推送 v* 格式的 tag（如 v1.4.0）
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # ── Job 1: Windows 构建安装包 ──────────────────────────────────────
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.VERSION }}
      tag:     ${{ steps.ver.outputs.TAG }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Extract version from tag
        id: ver
        shell: pwsh
        run: |
          $tag     = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag"         >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $version"

      - name: Update manifest.json
        shell: pwsh
        run: |
          python -m unittest tests.test_update_manifest
          python scripts/update_manifest.py

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build installer
        shell: pwsh
        working-directory: _BsKeyTools
        run: makensis Setup_BsKeyTools.nsi

      - name: Rename installer
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.VERSION }}"
          Move-Item "_BsKeyTools\_BsKeyTools.exe" "_BsKeyTools\BsKeyTools_v$v.exe"

      - name: Commit manifest changes back to main
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _BsKeyTools/manifest.json _BsKeyTools/version.dat _BsKeyTools/Setup_BsKeyTools.nsi
          $changed = (git diff --staged --quiet; -not $?)
          if ($changed) {
            git commit -m "chore: auto-update manifest.json for ${{ steps.ver.outputs.TAG }} [skip ci]"
            git push origin HEAD:main
          } else {
            Write-Host "manifest 无变动，跳过 commit"
          }

      # 将 exe 传给下一个 job
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: "_BsKeyTools/BsKeyTools_v${{ steps.ver.outputs.VERSION }}.exe"
          retention-days: 1

  # ── Job 2: 发布到 GitHub + Gitee，镜像代码 ─────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: "BsKeyTools v${{ needs.build.outputs.version }}"
          files: "dist/BsKeyTools_v${{ needs.build.outputs.version }}.exe"
          generate_release_notes: false

      - name: Create Gitee Release and upload installer
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          TAG="${{ needs.build.outputs.tag }}"
          EXE="dist/BsKeyTools_v${VERSION}.exe"

          # 读取 releaseNote（从 manifest.json 提取）
          NOTE=$(python3 -c "import json; d=json.load(open('_BsKeyTools/manifest.json')); print(d.get('releaseNote',''))" 2>/dev/null || echo "")
          export VERSION TAG NOTE

          # 创建 Gitee Release
          python3 - <<PY
          import json
          import os

          payload = {
              "access_token": os.environ["GITEE_TOKEN"],
              "tag_name": os.environ["TAG"],
              "name": f"BsKeyTools v{os.environ['VERSION']}",
              "body": os.environ["NOTE"],
              "target_commitish": "main",
          }
          with open("gitee_release_payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

          RESP=$(curl -s -X POST "https://gitee.com/api/v5/repos/acebullet/BsKeyTools/releases" \
            -H "Content-Type: application/json" \
            --data-binary @gitee_release_payload.json)

          RELEASE_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Gitee Release ID: $RELEASE_ID"

          # 上传 exe 到 Gitee Release
          curl -s -X POST "https://gitee.com/api/v5/repos/acebullet/BsKeyTools/releases/${RELEASE_ID}/attach_files" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "file=@${EXE}"

          echo "✅ Gitee Release v${VERSION} 发布完成"

      - name: Mirror to Gitee
        uses: wearerequired/git-mirror-action@master
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
        with:
          source-repo: "git@github.com:AniBullet/BsKeyTools.git"
          destination-repo: "git@gitee.com:acebullet/BsKeyTools.git"
